name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security problems go through private reporting, see SECURITY.md — not here.
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Package, PHP, Laravel and Filament versions.
      placeholder: filament-acceptance 0.1.0, PHP 8.4, Laravel 13.2, Filament 5.1
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The shortest code or steps that show the problem.
    validations:
      required: true
